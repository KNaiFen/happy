name: Codex Android field E2E

on:
  workflow_run:
    workflows: ["Happy monorepo CI"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      force_full_field:
        description: Run the full Field scenario even when a success receipt exists
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: codex-android-field-${{ github.workflow }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  reuse_ci_artifact:
    name: Select verified CI Official Codex artifact
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.resolve.outputs.selected }}
      reason: ${{ steps.resolve.outputs.reason }}
      source_run_id: ${{ steps.resolve.outputs.source_run_id }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      artifact_id: ${{ steps.resolve.outputs.artifact_id }}
      artifact_digest: ${{ steps.resolve.outputs.artifact_digest }}
      recipe_fingerprint: ${{ steps.resolve.outputs.recipe_fingerprint }}
    steps:
      - name: Checkout target CI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Resolve exact successful CI artifact
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/official-codex-artifact-reuse.cjs resolve
          "${{ github.event.workflow_run.id }}" "${{ github.event.workflow_run.head_sha }}"

  official_codex:
    name: Build latest stable official Codex source
    if: github.event_name != 'workflow_run'
    uses: ./.github/workflows/build-official-codex-source.yml

  field_dedup:
    name: Check prior successful Android Field receipt
    needs: [reuse_ci_artifact, official_codex]
    if: >-
      always() && (
        (github.event_name == 'workflow_run' && needs.reuse_ci_artifact.result == 'success' && needs.reuse_ci_artifact.outputs.selected == 'true') ||
        (github.event_name != 'workflow_run' && needs.official_codex.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.dedup.outputs.should_run }}
      reason: ${{ steps.dedup.outputs.reason }}
      receipt_run_id: ${{ steps.dedup.outputs.receipt_run_id }}
      receipt_artifact_id: ${{ steps.dedup.outputs.receipt_artifact_id }}
      receipt_artifact_digest: ${{ steps.dedup.outputs.receipt_artifact_digest }}
    steps:
      - name: Checkout target Field source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && needs.reuse_ci_artifact.outputs.head_sha || github.sha }}
          persist-credentials: false

      - name: Find prior successful Field receipt
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
          HAPPY_FIELD_SOURCE_SHA: ${{ github.event_name == 'workflow_run' && needs.reuse_ci_artifact.outputs.head_sha || github.sha }}
          HAPPY_FIELD_SOURCE_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
          HAPPY_OFFICIAL_CODEX_RECIPE_FINGERPRINT: ${{ github.event_name == 'workflow_run' && needs.reuse_ci_artifact.outputs.recipe_fingerprint || needs.official_codex.outputs.recipe_fingerprint }}
        run: >-
          node scripts/ci/android-field-run-dedup.cjs find
          "$HAPPY_FIELD_SOURCE_SHA" "$HAPPY_OFFICIAL_CODEX_RECIPE_FINGERPRINT"
          "$HAPPY_FIELD_SOURCE_BRANCH" "$GITHUB_RUN_ID"
          "${{ github.event_name == 'workflow_dispatch' && inputs.force_full_field || false }}"

  field_apk:
    name: Build or reuse Android Field APK
    needs: [reuse_ci_artifact, official_codex, field_dedup]
    if: >-
      always() &&
      needs.field_dedup.result == 'success' &&
      needs.field_dedup.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      HAPPY_FIELD_SOURCE_SHA: ${{ github.event_name == 'workflow_run' && needs.reuse_ci_artifact.outputs.head_sha || github.sha }}
    outputs:
      app_fingerprint: ${{ steps.fingerprint.outputs.app_fingerprint }}
      artifact_name: ${{ steps.fingerprint.outputs.artifact_name }}
      artifact_id: ${{ steps.upload.outputs.artifact-id || steps.reuse.outputs.artifact_id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest || steps.reuse.outputs.artifact_digest }}
      reused: ${{ steps.reuse.outputs.selected }}
      producer_run_id: ${{ steps.reuse.outputs.producer_run_id || github.run_id }}
      compiled_happy_source_sha: ${{ steps.reuse.outputs.compiled_happy_source_sha || (github.event_name == 'workflow_run' && needs.reuse_ci_artifact.outputs.head_sha || github.sha) }}
    steps:
      - name: Checkout App source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && needs.reuse_ci_artifact.outputs.head_sha || github.sha }}
          persist-credentials: false

      - name: Compute Android Field App fingerprint
        id: fingerprint
        run: node scripts/ci/android-field-apk-reuse.cjs fingerprint

      - name: Find verified Android Field APK
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/android-field-apk-reuse.cjs find
          "${{ steps.fingerprint.outputs.app_fingerprint }}" "$GITHUB_RUN_ID"

      - name: Install pnpm for APK build
        if: steps.reuse.outputs.selected != 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.11.0

      - name: Set up Node.js for APK build
        if: steps.reuse.outputs.selected != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java for APK build
        if: steps.reuse.outputs.selected != 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK for APK build
        if: steps.reuse.outputs.selected != 'true'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android APK build tools
        if: steps.reuse.outputs.selected != 'true'
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Configure Gradle cache for APK build
        if: steps.reuse.outputs.selected != 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install APK build dependencies
        if: steps.reuse.outputs.selected != 'true'
        run: timeout 5m pnpm install --frozen-lockfile

      - name: Build Wire dependency for APK
        if: steps.reuse.outputs.selected != 'true'
        run: pnpm --filter @slopus/happy-wire build

      - name: Report Android capacity before APK build
        if: steps.reuse.outputs.selected != 'true'
        run: df -h /

      - name: Build and verify standalone New Architecture x86_64 APK
        if: steps.reuse.outputs.selected != 'true'
        run: bash scripts/ci/build-android-field-apk.sh "$RUNNER_TEMP/happy-field-apk-artifact"

      - name: Write source-bound Android Field APK manifest
        if: steps.reuse.outputs.selected != 'true'
        run: >-
          node scripts/ci/android-field-apk-reuse.cjs write
          "$RUNNER_TEMP/happy-field-apk-artifact/app-release.apk"
          "$RUNNER_TEMP/happy-field-apk-artifact/field-apk-manifest.json"
          "${{ steps.fingerprint.outputs.app_fingerprint }}" "$HAPPY_FIELD_SOURCE_SHA"

      - name: Upload reusable Android Field APK
        id: upload
        if: steps.reuse.outputs.selected != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.fingerprint.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/happy-field-apk-artifact/app-release.apk
            ${{ runner.temp }}/happy-field-apk-artifact/field-apk-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Report Android capacity after APK build
        if: always() && steps.reuse.outputs.selected != 'true'
        run: df -h /

  android-field:
    name: API 36 App to official Codex field round trip
    needs: [reuse_ci_artifact, official_codex, field_dedup, field_apk]
    if: >-
      always() &&
      needs.field_dedup.result == 'success' &&
      needs.field_dedup.outputs.should_run == 'true' &&
      needs.field_apk.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: "1"
      HAPPY_MOBILE_E2E_PORT: "53586"
      HAPPY_MOBILE_E2E_BOOTSTRAP_PORT: "53587"
      HAPPY_MOBILE_E2E_ROUNDTRIP_TIMEOUT_MS: "900000"
      HAPPY_MOBILE_E2E_WAIT_FOR_APP_READY: "1"
      HAPPY_MOBILE_E2E_APP_READY_TIMEOUT_MS: "1800000"
      MAESTRO_VERSION: "2.7.0"
      MAESTRO_SHA256: "a4ccab6b604617e7aef6db4f885666056eabe5cfa32befaa3bc994041b8fcbb5"
      MAESTRO_CLI_NO_ANALYTICS: "1"
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: "true"
      HAPPY_FIELD_SOURCE_SHA: ${{ github.event_name == 'workflow_run' && needs.reuse_ci_artifact.outputs.head_sha || github.sha }}
      HAPPY_FIELD_SOURCE_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
      HAPPY_OFFICIAL_CODEX_ATTESTED_SHA: ${{ github.event_name == 'workflow_run' && needs.reuse_ci_artifact.outputs.head_sha || needs.official_codex.outputs.attested_happy_source_sha }}
      HAPPY_OFFICIAL_CODEX_ATTESTATION_RUN_ID: ${{ github.event_name == 'workflow_run' && needs.reuse_ci_artifact.outputs.source_run_id || needs.official_codex.outputs.attestation_run_id }}
      HAPPY_OFFICIAL_CODEX_RECIPE_FINGERPRINT: ${{ github.event_name == 'workflow_run' && needs.reuse_ci_artifact.outputs.recipe_fingerprint || needs.official_codex.outputs.recipe_fingerprint }}
      HAPPY_EXPECTED_CODEX_COMMIT: ${{ github.event_name != 'workflow_run' && needs.official_codex.outputs.commit || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && needs.reuse_ci_artifact.outputs.head_sha || github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: timeout 5m pnpm install --frozen-lockfile

      - name: Build Wire and CLI
        run: |
          pnpm --filter @slopus/happy-wire build
          pnpm --filter happy build

      - name: Download verified Android Field APK
        id: field_apk
        env:
          GH_TOKEN: ${{ github.token }}
          FIELD_APK_ARTIFACT_ID: ${{ needs.field_apk.outputs.artifact_id }}
          FIELD_APK_ARTIFACT_DIGEST: ${{ needs.field_apk.outputs.artifact_digest }}
          FIELD_APK_FINGERPRINT: ${{ needs.field_apk.outputs.app_fingerprint }}
        run: >-
          node scripts/ci/android-field-apk-reuse.cjs download
          "$FIELD_APK_ARTIFACT_ID" "$FIELD_APK_ARTIFACT_DIGEST"
          "$FIELD_APK_FINGERPRINT" "$RUNNER_TEMP/verified-field-apk"

      - name: Verify Android Field APK content
        run: >-
          bash scripts/ci/verify-android-field-apk.sh
          "$HAPPY_FIELD_APK_PATH" "${{ steps.field_apk.outputs.compiled_happy_source_sha }}"
          "${{ steps.field_apk.outputs.compiled_commit_timestamp }}"

      - name: Pack and install CLI under test
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/happy-cli/package.json').version")"
          PACK_ROOT="$RUNNER_TEMP/happy-mobile-cli-package-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          INSTALL_ROOT="$RUNNER_TEMP/happy-mobile-cli-installed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$PACK_ROOT" "$INSTALL_ROOT"
          pnpm --filter happy pack --pack-destination "$PACK_ROOT"
          ARCHIVE="$PACK_ROOT/happy-${VERSION}.tgz"
          test -f "$ARCHIVE"
          npm install --ignore-scripts --prefix "$INSTALL_ROOT" "$ARCHIVE"
          ENTRYPOINT="$INSTALL_ROOT/node_modules/happy/bin/happy.mjs"
          test -f "$ENTRYPOINT"
          test "$(node --no-warnings --no-deprecation "$ENTRYPOINT" --version)" = \
            "happy version: $VERSION"
          printf 'HAPPY_MOBILE_E2E_CLI_ENTRYPOINT=%s\n' "$ENTRYPOINT" >> "$GITHUB_ENV"

      - name: Download exact official Codex artifact
        env:
          GH_TOKEN: ${{ github.token }}
          OFFICIAL_CODEX_ARTIFACT_ID: ${{ github.event_name == 'workflow_run' && needs.reuse_ci_artifact.outputs.artifact_id || needs.official_codex.outputs.artifact_id }}
          OFFICIAL_CODEX_ARTIFACT_DIGEST: ${{ github.event_name == 'workflow_run' && needs.reuse_ci_artifact.outputs.artifact_digest || needs.official_codex.outputs.artifact_digest }}
        run: >-
          node scripts/ci/official-codex-artifact-reuse.cjs download
          "$OFFICIAL_CODEX_ARTIFACT_ID" "$OFFICIAL_CODEX_ARTIFACT_DIGEST"
          "$RUNNER_TEMP/official-codex"

      - name: Validate official Codex artifact content
        run: >-
          node scripts/ci/official-codex-artifact-reuse.cjs verify
          "$RUNNER_TEMP/official-codex" "$HAPPY_OFFICIAL_CODEX_ATTESTED_SHA" "$HAPPY_EXPECTED_CODEX_COMMIT"
          "$HAPPY_OFFICIAL_CODEX_RECIPE_FINGERPRINT" "$HAPPY_OFFICIAL_CODEX_ATTESTATION_RUN_ID"

      - name: Verify official Codex provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CODEX_BIN="$RUNNER_TEMP/official-codex/bin/codex"
          CODE_MODE_HOST="$RUNNER_TEMP/official-codex/bin/codex-code-mode-host"
          BWRAP="$RUNNER_TEMP/official-codex/bin/codex-resources/bwrap"
          chmod 0755 "$CODEX_BIN" "$CODE_MODE_HOST" "$BWRAP"
          test -x "$CODEX_BIN"
          test -x "$CODE_MODE_HOST"
          test -x "$BWRAP"
          test "$(timeout 15s "$CODEX_BIN" --version)" = \
            "codex-cli $HAPPY_SCENARIO_CODEX_VERSION"
          test "$(jq -r '.happySourceSha' "$RUNNER_TEMP/official-codex/source.json")" = \
            "$HAPPY_OFFICIAL_CODEX_ATTESTED_SHA"
          if test -n "$HAPPY_EXPECTED_CODEX_COMMIT"; then
            test "$(jq -r '.commit' "$RUNNER_TEMP/official-codex/source.json")" = \
              "$HAPPY_EXPECTED_CODEX_COMMIT"
          fi
          TAG="$(jq -r '.tag' "$RUNNER_TEMP/official-codex/source.json")"
          VERSION="$(jq -r '.version' "$RUNNER_TEMP/official-codex/source.json")"
          test "$TAG" = "rust-v$VERSION"
          RELEASE_JSON="$(gh api "repos/openai/codex/releases/tags/$TAG")"
          test "$(jq -r '.draft' <<< "$RELEASE_JSON")" = false
          test "$(jq -r '.prerelease' <<< "$RELEASE_JSON")" = false
          REF_JSON="$(gh api "repos/openai/codex/git/ref/tags/$TAG")"
          OBJECT_TYPE="$(jq -r '.object.type' <<< "$REF_JSON")"
          OBJECT_SHA="$(jq -r '.object.sha' <<< "$REF_JSON")"
          for _ in 1 2 3 4; do
            if test "$OBJECT_TYPE" = commit; then
              break
            fi
            test "$OBJECT_TYPE" = tag
            TAG_JSON="$(gh api "repos/openai/codex/git/tags/$OBJECT_SHA")"
            OBJECT_TYPE="$(jq -r '.object.type' <<< "$TAG_JSON")"
            OBJECT_SHA="$(jq -r '.object.sha' <<< "$TAG_JSON")"
          done
          test "$OBJECT_TYPE" = commit
          test "$OBJECT_SHA" = "$HAPPY_SCENARIO_CODEX_COMMIT"
          test "$(jq -r '.runtimeBundleVersion' "$RUNNER_TEMP/official-codex/source.json")" = 2
          test "$(jq -r '.bwrapSha256' "$RUNNER_TEMP/official-codex/source.json")" = \
            "$(sha256sum "$BWRAP" | cut -d' ' -f1)"
          printf 'HAPPY_SCENARIO_CODEX_BIN=%s\n' "$CODEX_BIN" >> "$GITHUB_ENV"

      - name: Enable official Linux sandbox user namespaces
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Start real relay and prepare App authentication
        id: fixture
        run: |
          ROOT="$RUNNER_TEMP/happy-mobile-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          STATE_FILE="$ROOT/state.json"
          FIXTURE_LOG="$RUNNER_TEMP/happy-mobile-e2e-fixture.log"
          PID_FILE="$RUNNER_TEMP/happy-mobile-e2e.pid"
          mkdir -p "$ROOT"
          HAPPY_MOBILE_E2E_ROOT="$ROOT" \
          HAPPY_MOBILE_E2E_STATE_FILE="$STATE_FILE" \
          node node_modules/tsx/dist/cli.mjs \
            --tsconfig packages/happy-cli/tsconfig.json \
            scripts/ci/codex-mobile-field-fixture.ts \
            > "$FIXTURE_LOG" 2>&1 &
          FIXTURE_PID=$!
          printf '%s\n' "$FIXTURE_PID" > "$PID_FILE"

          for _ in $(seq 1 900); do
            if test -f "$STATE_FILE"; then
              break
            fi
            if ! kill -0 "$FIXTURE_PID" 2>/dev/null; then
              echo "Mobile fixture exited during startup." >&2
              tail -n 200 "$FIXTURE_LOG" >&2
              exit 1
            fi
            sleep 0.1
          done
          test -f "$STATE_FILE"

          node - "$STATE_FILE" "$GITHUB_ENV" <<'NODE'
          const fs = require('node:fs');
          const [statePath, envPath] = process.argv.slice(2);
          const state = JSON.parse(fs.readFileSync(statePath, 'utf8'));
          for (const value of [state.appToken, state.appSecret]) {
            process.stdout.write(`::add-mask::${value}\n`);
          }
          fs.appendFileSync(
            envPath,
            [
              `HAPPY_MOBILE_E2E_ROOT=${state.root}`,
              `HAPPY_MOBILE_E2E_STATE_FILE=${statePath}`,
              `HAPPY_MOBILE_E2E_PID_FILE=${process.env.RUNNER_TEMP}/happy-mobile-e2e.pid`,
              `HAPPY_MOBILE_E2E_CREDENTIAL_PID_FILE=${process.env.RUNNER_TEMP}/happy-mobile-credential-server.pid`,
              '',
            ].join('\n'),
          );
          NODE

          CREDENTIAL_LOG="$RUNNER_TEMP/happy-mobile-credential-server.log"
          CREDENTIAL_PID_FILE="$RUNNER_TEMP/happy-mobile-credential-server.pid"
          HAPPY_MOBILE_E2E_STATE_FILE="$STATE_FILE" \
          HAPPY_MOBILE_E2E_BOOTSTRAP_PORT="$HAPPY_MOBILE_E2E_BOOTSTRAP_PORT" \
          node scripts/ci/mobile-field-credential-server.cjs \
            > "$CREDENTIAL_LOG" 2>&1 &
          CREDENTIAL_PID=$!
          printf '%s\n' "$CREDENTIAL_PID" > "$CREDENTIAL_PID_FILE"
          for _ in $(seq 1 300); do
            if curl --fail --silent --output /dev/null \
              "http://127.0.0.1:${HAPPY_MOBILE_E2E_BOOTSTRAP_PORT}/credentials"; then
              break
            fi
            if ! kill -0 "$CREDENTIAL_PID" 2>/dev/null; then
              echo "Mobile Field credential server exited during startup." >&2
              tail -n 50 "$CREDENTIAL_LOG" >&2
              exit 1
            fi
            sleep 0.1
          done
          kill -0 "$CREDENTIAL_PID"
          curl --fail --silent --output /dev/null \
            "http://127.0.0.1:${HAPPY_MOBILE_E2E_BOOTSTRAP_PORT}/credentials"

      - name: Install pinned Maestro CLI
        run: |
          ARCHIVE="$RUNNER_TEMP/maestro.zip"
          INSTALL_ROOT="$RUNNER_TEMP/maestro-${MAESTRO_VERSION}"
          curl --fail --location --silent --show-error \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip" \
            --output "$ARCHIVE"
          printf '%s  %s\n' "$MAESTRO_SHA256" "$ARCHIVE" | sha256sum --check
          mkdir -p "$INSTALL_ROOT"
          unzip -q "$ARCHIVE" -d "$INSTALL_ROOT"
          MAESTRO_BIN="$INSTALL_ROOT/maestro/bin/maestro"
          test -x "$MAESTRO_BIN"
          test "$("$MAESTRO_BIN" --version)" = "$MAESTRO_VERSION"
          printf 'MAESTRO_BIN=%s\n' "$MAESTRO_BIN" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run API 36 Android field scenario
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disable-spellchecker: true
          script: bash scripts/ci/run-codex-android-field-e2e.sh

      - name: Write successful Field receipt
        id: field_receipt
        if: env.HAPPY_FIELD_SOURCE_BRANCH == 'main' && github.run_attempt == 1
        run: >-
          node scripts/ci/android-field-run-dedup.cjs write
          "$RUNNER_TEMP/happy-android-field-success/receipt.json"
          "$HAPPY_FIELD_SOURCE_SHA" "$HAPPY_OFFICIAL_CODEX_RECIPE_FINGERPRINT"
          "$HAPPY_OFFICIAL_CODEX_ATTESTATION_RUN_ID"

      - name: Upload successful Field receipt
        if: env.HAPPY_FIELD_SOURCE_BRANCH == 'main' && github.run_attempt == 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.field_receipt.outputs.artifact_name }}
          path: ${{ runner.temp }}/happy-android-field-success/receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Stop fixture
        if: always()
        run: |
          for PID_FILE in \
            "$RUNNER_TEMP/happy-mobile-credential-server.pid" \
            "$RUNNER_TEMP/happy-mobile-e2e.pid"; do
            if test -f "$PID_FILE"; then
              PID="$(tr -d '[:space:]' < "$PID_FILE")"
              if kill -0 "$PID" 2>/dev/null; then
                kill -TERM "$PID"
                for _ in $(seq 1 100); do
                  if ! kill -0 "$PID" 2>/dev/null; then
                    break
                  fi
                  sleep 0.1
                done
              fi
            fi
          done

      - name: Upload Android field artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-android-field-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/happy-mobile-field-artifacts
            ${{ runner.temp }}/happy-mobile-e2e-fixture.log
            ${{ runner.temp }}/happy-mobile-credential-server.log
            ${{ runner.temp }}/official-codex/source.json
            ${{ env.HAPPY_MOBILE_E2E_ROOT }}/roundtrip-verified.json
            ${{ env.HAPPY_MOBILE_E2E_ROOT }}/field-diagnostics.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload fixture logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-android-field-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/happy-mobile-e2e-fixture.log
            ${{ env.HAPPY_MOBILE_E2E_ROOT }}/migration.log
            ${{ env.HAPPY_MOBILE_E2E_ROOT }}/relay.log
            ${{ env.HAPPY_MOBILE_E2E_ROOT }}/daemon.log
            ${{ env.HAPPY_MOBILE_E2E_ROOT }}/cli-home/logs/*.log
            ${{ env.HAPPY_MOBILE_E2E_ROOT }}/field-diagnostics.json
          if-no-files-found: warn
          retention-days: 7
