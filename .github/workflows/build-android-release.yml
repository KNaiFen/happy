name: Build Android APK on version bump

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      version:
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
    outputs:
      candidate_artifact_id:
        description: Immutable Actions artifact ID for the verified Android candidate.
        value: ${{ jobs.build.outputs.candidate_artifact_id }}
      candidate_artifact_digest:
        description: ZIP SHA-256 reported by Actions for the Android candidate.
        value: ${{ jobs.build.outputs.candidate_artifact_digest }}
      candidate_artifact_name:
        description: Exact Actions artifact name for the Android candidate.
        value: ${{ jobs.build.outputs.candidate_artifact_name }}

permissions:
  contents: read

concurrency:
  group: android-apk-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  ci:
    name: Validate Android app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify gated source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(node -p "require('./packages/happy-app/package.json').version")" = "$VERSION"

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck APP
        run: pnpm --filter happy-app typecheck

      - name: Test APP
        run: pnpm --filter happy-app exec vitest run

  build:
    needs: ci
    if: needs.ci.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      candidate_artifact_id: ${{ steps.upload_candidate.outputs.artifact-id }}
      candidate_artifact_digest: ${{ steps.upload_candidate.outputs.artifact-digest }}
      candidate_artifact_name: ${{ steps.candidate.outputs.artifact_name }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      VERSION: ${{ inputs.version }}
      EXPECTED_CERT_SHA256: fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify gated source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        env:
          APP_ENV: production
          NODE_ENV: production
          HAPPY_DISABLE_OTA: "1"
          HAPPY_LOCAL_RELEASE: "1"
          HAPPY_BUILD_COMMIT_SHA: ${{ env.SOURCE_SHA }}
        run: pnpm --filter happy-app exec expo prebuild --platform android --no-install

      - name: Verify generated Android manifest
        run: node scripts/ci/verify-generated-android-manifest.cjs packages/happy-app/android/app/src/main/AndroidManifest.xml

      - name: Restore matching Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > packages/happy-app/android/app/debug.keystore
          chmod 600 packages/happy-app/android/app/debug.keystore
          keytool -list -v \
            -keystore packages/happy-app/android/app/debug.keystore \
            -storepass android \
            -alias androiddebugkey > "$RUNNER_TEMP/keystore.txt"
          grep -Fq "FA:C6:17:45:DC:09:03:78:6F:B9:ED:E6:2A:96:2B:39:9F:73:48:F0:BB:6F:89:9B:83:32:66:75:91:03:3B:9C" "$RUNNER_TEMP/keystore.txt"

      - name: Build ARM64 release APK
        env:
          APP_ENV: production
          NODE_ENV: production
          HAPPY_DISABLE_OTA: "1"
          HAPPY_LOCAL_RELEASE: "1"
          HAPPY_BUILD_COMMIT_SHA: ${{ env.SOURCE_SHA }}
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx5120m -XX:MaxMetaspaceSize=1024m/' packages/happy-app/android/gradle.properties
          packages/happy-app/android/gradlew \
            -p packages/happy-app/android \
            assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            --no-daemon

      - name: Verify and stage APK
        env:
          BUILD_COMMIT_SHA: ${{ env.SOURCE_SHA }}
        run: |
          set -euo pipefail
          APK="packages/happy-app/android/app/build/outputs/apk/release/app-release.apk"
          TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          BADGING="$RUNNER_TEMP/badging.txt"
          MANIFEST="$RUNNER_TEMP/manifest.txt"
          SIGNATURE="$RUNNER_TEMP/signature.txt"
          APP_CONFIG="$RUNNER_TEMP/app.config.json"
          UPDATES_METADATA="$RUNNER_TEMP/updates-metadata.txt"

          require_fixed() {
            local needle="$1"
            local file="$2"
            local message="$3"
            if ! grep -Fq "$needle" "$file"; then
              echo "$message" >&2
              exit 1
            fi
          }

          "$TOOLS/aapt" dump badging "$APK" | tee "$BADGING"
          require_fixed "package: name='com.ex3ndr.happy'" "$BADGING" 'APK package mismatch.'
          require_fixed "versionName='${VERSION}'" "$BADGING" 'APK versionName mismatch.'
          require_fixed "targetSdkVersion:'36'" "$BADGING" 'APK target SDK must be 36.'
          require_fixed "native-code: 'arm64-v8a'" "$BADGING" 'APK must contain ARM64 native code only.'

          "$TOOLS/aapt2" dump xmltree --file AndroidManifest.xml "$APK" > "$MANIFEST"
          if ! grep -Eq 'usesCleartextTraffic.*(0xffffffff|true)' "$MANIFEST"; then
            echo 'APK manifest is missing android:usesCleartextTraffic=true.' >&2
            grep -E 'application|usesCleartextTraffic' "$MANIFEST" >&2 || true
            exit 1
          fi
          if ! grep -A2 'expo.modules.updates.ENABLED' "$MANIFEST" > "$UPDATES_METADATA"; then
            echo 'APK manifest is missing expo.modules.updates.ENABLED metadata.' >&2
            exit 1
          fi
          if ! grep -Fq '=false' "$UPDATES_METADATA"; then
            echo 'APK manifest must set expo.modules.updates.ENABLED=false.' >&2
            cat "$UPDATES_METADATA" >&2
            exit 1
          fi
          if grep -Eq 'EXPO_UPDATE_URL|u\.expo\.dev' "$MANIFEST"; then
            echo 'OTA update URL must not be present in the APK manifest.' >&2
            exit 1
          fi

          unzip -p "$APK" assets/app.config > "$APP_CONFIG"
          node - "$APP_CONFIG" <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const [major, minor, patch] = process.env.VERSION.split('.').map(Number);
          const expectedCode = major * 10000 + minor * 100 + patch;
          if (config.version !== process.env.VERSION) throw new Error('APP version mismatch');
          if (config.android?.versionCode !== expectedCode) throw new Error('Android versionCode mismatch');
          if (config.android?.package !== 'com.ex3ndr.happy') throw new Error('Android package mismatch');
          if (config.android?.usesCleartextTraffic !== true) throw new Error('Android cleartext transport support missing');
          if (config.updates?.enabled !== false || config.updates?.url) throw new Error('OTA must be disabled');
          if (config.extra?.app?.buildCommitSha !== process.env.BUILD_COMMIT_SHA) throw new Error('Build commit mismatch');
          NODE

          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee "$SIGNATURE"
          require_fixed "Signer #1 certificate SHA-256 digest: ${EXPECTED_CERT_SHA256}" "$SIGNATURE" 'APK signing certificate mismatch.'
          "$TOOLS/zipalign" -c -P 16 4 "$APK"

          mkdir -p artifacts
          cp "$APK" "artifacts/happy-app-${VERSION}-android-arm64-v8a-no-ota.apk"
          sha256sum "artifacts/happy-app-${VERSION}-android-arm64-v8a-no-ota.apk"

      - name: Write Android release candidate manifest
        run: node scripts/ci/release-candidate-promotion.cjs write-manifest android "$VERSION" "$SOURCE_SHA" artifacts

      - name: Declare Android candidate artifact
        id: candidate
        run: echo "artifact_name=release-candidate-android-${VERSION}-${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload Android release candidate
        id: upload_candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.candidate.outputs.artifact_name }}
          path: |
            artifacts/release-candidate.json
            artifacts/happy-app-${{ env.VERSION }}-android-arm64-v8a-no-ota.apk
          if-no-files-found: error
          retention-days: 7
