name: CodeQL security analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '30 1 * * 1'

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  classify:
    name: Classify CodeQL changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_analyze: ${{ steps.changes.outputs.should_analyze }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FORCE_ALL: ${{ github.event_name == 'schedule' }}
        run: node scripts/ci/codeql-change-classifier.cjs "$BASE_SHA" "$HEAD_SHA" "$FORCE_ALL"

  analyze:
    name: CodeQL (${{ matrix.language }})
    needs: classify
    if: needs.classify.outputs.should_analyze == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
          - python
          - rust
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          build-mode: none
          languages: ${{ matrix.language }}

      - name: Analyze
        uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          category: /language:${{ matrix.language }}

  gate:
    name: Required CodeQL gate
    if: always()
    needs:
      - classify
      - analyze
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require selected analysis to pass
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          SHOULD_ANALYZE: ${{ needs.classify.outputs.should_analyze }}
          ANALYZE_RESULT: ${{ needs.analyze.result }}
        run: |
          test "$CLASSIFY_RESULT" = success
          if [ "$SHOULD_ANALYZE" = true ]; then
            test "$ANALYZE_RESULT" = success
          else
            test "$ANALYZE_RESULT" = skipped
          fi
