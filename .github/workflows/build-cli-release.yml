name: Build CLI package on version bump

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      version:
        required: true
        type: string
    outputs:
      candidate_artifact_id:
        description: Immutable Actions artifact ID for the verified CLI candidate.
        value: ${{ jobs.build.outputs.candidate_artifact_id }}
      candidate_artifact_digest:
        description: ZIP SHA-256 reported by Actions for the CLI candidate.
        value: ${{ jobs.build.outputs.candidate_artifact_digest }}
      candidate_artifact_name:
        description: Exact Actions artifact name for the CLI candidate.
        value: ${{ jobs.build.outputs.candidate_artifact_name }}

permissions:
  contents: read

concurrency:
  group: cli-package-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      candidate_artifact_id: ${{ steps.upload_candidate.outputs.artifact-id }}
      candidate_artifact_digest: ${{ steps.upload_candidate.outputs.artifact-digest }}
      candidate_artifact_name: ${{ steps.candidate.outputs.artifact_name }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify gated source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(node -p "require('./packages/happy-cli/package.json').version")" = "$VERSION"

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm --filter happy build

      - name: Pack npm archive
        run: |
          mkdir -p artifacts
          pnpm --filter happy pack --pack-destination "$GITHUB_WORKSPACE/artifacts"

      - name: Verify npm archive
        run: |
          set -euo pipefail
          ARCHIVE="artifacts/happy-${VERSION}.tgz"
          CONTENTS="$RUNNER_TEMP/happy-cli-archive.txt"
          test -f "$ARCHIVE"
          tar -xOf "$ARCHIVE" package/package.json > "$RUNNER_TEMP/happy-cli-package.json"
          node - "$RUNNER_TEMP/happy-cli-package.json" "$VERSION" <<'NODE'
          const fs = require('node:fs');
          const [file, expectedVersion] = process.argv.slice(2);
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (pkg.name !== 'happy') throw new Error(`Unexpected package name: ${pkg.name}`);
          if (pkg.version !== expectedVersion) throw new Error(`Version mismatch: ${pkg.version}`);
          if (pkg.bin?.happy !== './bin/happy.mjs') throw new Error('Missing happy binary');
          for (const forbidden of ['@anthropic-ai/claude-agent-sdk', '@anthropic-ai/claude-code', '@anthropic-ai/sdk']) {
            if (pkg.dependencies?.[forbidden]) throw new Error(`Forbidden dependency: ${forbidden}`);
          }
          NODE
          tar -tzf "$ARCHIVE" > "$CONTENTS"
          grep -Fxq package/tools/archives/difftastic-arm64-darwin.tar.gz "$CONTENTS"
          grep -Fxq package/tools/archives/ripgrep-arm64-darwin.tar.gz "$CONTENTS"
          sha256sum "$ARCHIVE"

      - name: Install and smoke test npm archive
        run: |
          set -euo pipefail
          ARCHIVE="$GITHUB_WORKSPACE/artifacts/happy-${VERSION}.tgz"
          INSTALL_ROOT="$RUNNER_TEMP/happy-cli-installed"
          npm install --ignore-scripts --prefix "$INSTALL_ROOT" "$ARCHIVE"
          BIN="$INSTALL_ROOT/node_modules/happy/bin/happy.mjs"
          VERSION_OUT="$RUNNER_TEMP/happy-version.out"
          HELP_OUT="$RUNNER_TEMP/happy-help.out"
          node --no-warnings --no-deprecation "$BIN" --version >"$VERSION_OUT"
          if ! grep -Fxq "happy version: $VERSION" "$VERSION_OUT"; then
            echo "Unexpected installed CLI version output:" >&2
            cat "$VERSION_OUT" >&2
            exit 1
          fi
          node --no-warnings --no-deprecation "$BIN" --help >"$HELP_OUT"
          if ! grep -Fq 'happy codex [official Codex options or prompt]' "$HELP_OUT"; then
            echo "Installed CLI help is missing the native Codex entrypoint:" >&2
            cat "$HELP_OUT" >&2
            exit 1
          fi
          set +e
          node --no-warnings --no-deprecation "$BIN" claude >"$RUNNER_TEMP/happy-removed-command.out" 2>"$RUNNER_TEMP/happy-removed-command.err"
          STATUS=$?
          set -e
          if test "$STATUS" -eq 0; then
            echo "Removed Claude command unexpectedly succeeded" >&2
            exit 1
          fi
          if ! grep -Fq 'Unknown Happy command: claude' "$RUNNER_TEMP/happy-removed-command.err"; then
            echo "Removed Claude command returned an unexpected error:" >&2
            cat "$RUNNER_TEMP/happy-removed-command.err" >&2
            exit 1
          fi

      - name: Write CLI release candidate manifest
        run: node scripts/ci/release-candidate-promotion.cjs write-manifest cli "$VERSION" "$SOURCE_SHA" artifacts

      - name: Declare CLI candidate artifact
        id: candidate
        run: echo "artifact_name=release-candidate-cli-${VERSION}-${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload CLI release candidate
        id: upload_candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.candidate.outputs.artifact_name }}
          path: |
            artifacts/release-candidate.json
            artifacts/happy-${{ env.VERSION }}.tgz
          if-no-files-found: error
          retention-days: 7
