name: Build Debian 13 amd64 relay bundle on version bump

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      version:
        required: true
        type: string
    outputs:
      candidate_artifact_id:
        description: Immutable Actions artifact ID for the verified Debian relay candidate.
        value: ${{ jobs.build.outputs.candidate_artifact_id }}
      candidate_artifact_digest:
        description: ZIP SHA-256 reported by Actions for the Debian relay candidate.
        value: ${{ jobs.build.outputs.candidate_artifact_digest }}
      candidate_artifact_name:
        description: Exact Actions artifact name for the Debian relay candidate.
        value: ${{ jobs.build.outputs.candidate_artifact_name }}

permissions:
  contents: read

concurrency:
  group: debian13-relay-bundle-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate relay source and Server runtime
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify gated source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(node -p "require('./packages/happy-server/package.json').version")" = "$VERSION"

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Wire dependency
        run: pnpm --filter @slopus/happy-wire build

      - name: Generate Prisma client
        run: pnpm --filter happy-server-self-host generate

      - name: Typecheck Server
        run: pnpm --filter happy-server-self-host typecheck

      - name: Test Server
        run: pnpm --filter happy-server-self-host test

      - name: Build Server runtime
        run: pnpm --filter happy-server-self-host build

      - name: Lint deployment shell scripts
        run: |
          shellcheck \
            packages/happy-server/deploy/debian13-amd64/install.sh \
            packages/happy-server/deploy/debian13-amd64/relayctl.sh \
            scripts/ci/package-debian13-relay-bundle.sh \
            scripts/ci/verify-debian13-relay-bundle.sh \
            scripts/ci/test-verify-debian13-relay-bundle.sh \
            scripts/ci/test-debian13-relay-bundle.sh

      - name: Test final bundle verifier
        run: scripts/ci/test-verify-debian13-relay-bundle.sh

      - name: Validate distroless Node runtime contract
        run: |
          node --check packages/happy-server/deploy/debian13-amd64/entrypoint.mjs
          node -e '
            import("./packages/happy-server/dist/standalone.mjs").then(runtime => {
              if (typeof runtime.runMigrations !== "function" || typeof runtime.serve !== "function") {
                throw new Error("standalone runtime must export runMigrations and serve");
              }
            });
          '

      - name: Validate deployed production runtime contract
        run: |
          PROD_DIR="$RUNNER_TEMP/happy-server-production"
          pnpm --filter happy-server-self-host deploy --prod --legacy "$PROD_DIR"
          pnpm --dir "$PROD_DIR" exec prisma generate \
            --schema="$PROD_DIR/prisma/schema.prisma"
          node scripts/ci/verify-deployed-server-runtime.mjs "$PROD_DIR"

      - name: Validate Compose configuration
        run: |
          CONFIG_DIR="$RUNNER_TEMP/happy-relay-config"
          mkdir -p "$CONFIG_DIR/secrets"
          cp packages/happy-server/deploy/debian13-amd64/compose.yaml "$CONFIG_DIR/compose.yaml"
          sed "s/__VERSION__/$VERSION/g" \
            packages/happy-server/deploy/debian13-amd64/env.example > "$CONFIG_DIR/.env"
          printf '%064d\n' 0 > "$CONFIG_DIR/secrets/master-secret"
          docker compose \
            --project-directory "$CONFIG_DIR" \
            --env-file "$CONFIG_DIR/.env" \
            --file "$CONFIG_DIR/compose.yaml" \
            config --quiet

  build:
    name: Build and exercise offline relay bundle
    needs: validate
    if: needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      candidate_artifact_id: ${{ steps.upload_candidate.outputs.artifact-id }}
      candidate_artifact_digest: ${{ steps.upload_candidate.outputs.artifact-digest }}
      candidate_artifact_name: ${{ steps.candidate.outputs.artifact_name }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      VERSION: ${{ inputs.version }}
      IMAGE: happy-relay-server:${{ inputs.version }}-debian13-amd64
      BUNDLE_DIR: dist/relay-bundle
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify gated source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Debian 13 amd64 relay image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: packages/happy-server/deploy/debian13-amd64/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          build-args: |
            HAPPY_SERVER_VERSION=${{ env.VERSION }}
            VCS_REF=${{ env.SOURCE_SHA }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=debian13-relay-amd64
          cache-to: type=gha,mode=max,scope=debian13-relay-amd64

      - name: Verify image identity and relay-only contents
        run: |
          test "$(docker image inspect "$IMAGE" --format '{{.Architecture}}')" = amd64
          test "$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "$VERSION"
          test "$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$SOURCE_SHA"
          test "$(docker image inspect "$IMAGE" --format '{{.Config.User}}')" = 65532:65532
          docker run --rm --entrypoint /nodejs/bin/node "$IMAGE" -e '
            const fs = require("node:fs");
            const release = Object.fromEntries(
              fs.readFileSync("/etc/os-release", "utf8")
                .split("\n")
                .filter(line => line.includes("="))
                .map(line => {
                  const separator = line.indexOf("=");
                  return [line.slice(0, separator), line.slice(separator + 1).replace(/^"|"$/g, "")];
                }),
            );
            if (release.ID !== "debian" || release.VERSION_ID !== "13") process.exit(1);
            if (typeof process.getuid !== "function" || process.getuid() !== 65532) process.exit(1);
            if (!fs.statSync("/opt/happy-server/dist/standalone.mjs").isFile()) process.exit(1);
            if (!fs.statSync("/opt/happy-server/prisma/migrations").isDirectory()) process.exit(1);
            for (const forbidden of [
              "/opt/happy-server/webapp/index.html",
              "/bin/sh",
              "/bin/bash",
              "/busybox/sh",
              "/usr/bin/apt",
              "/usr/bin/apt-get",
              "/usr/bin/perl",
              "/usr/bin/npm",
              "/usr/local/bin/npm",
              "/usr/local/lib/node_modules/npm",
            ]) {
              if (fs.existsSync(forbidden)) process.exit(1);
            }
          '

      - name: Block Critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL

      - name: Prepare bundle output
        run: mkdir -p "$BUNDLE_DIR"

      - name: Generate CycloneDX image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          format: cyclonedx
          output: dist/relay-bundle/sbom.cdx.json
          exit-code: '0'

      - name: Package offline relay bundle
        run: |
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH="$(git show --no-patch --format=%ct "$SOURCE_SHA")"
          scripts/ci/package-debian13-relay-bundle.sh \
            --version "$VERSION" \
            --image "$IMAGE" \
            --sbom "$BUNDLE_DIR/sbom.cdx.json" \
            --output-dir "$BUNDLE_DIR"

      - name: Verify final bundle structure and checksums
        run: |
          scripts/ci/verify-debian13-relay-bundle.sh \
            "$BUNDLE_DIR/happy-relay-server-$VERSION-debian13-amd64.tar.gz" \
            "$VERSION"

      - name: Exercise delivered installer and relay lifecycle
        run: |
          sudo env "PATH=$PATH" GITHUB_ACTIONS=true \
            scripts/ci/test-debian13-relay-bundle.sh \
            "$BUNDLE_DIR/happy-relay-server-$VERSION-debian13-amd64.tar.gz" \
            "$VERSION"

      - name: Write Debian relay release candidate manifest
        run: >-
          node scripts/ci/release-candidate-promotion.cjs write-manifest relay "$VERSION" "$SOURCE_SHA" "$BUNDLE_DIR"

      - name: Declare Debian relay candidate artifact
        id: candidate
        run: echo "artifact_name=release-candidate-relay-${VERSION}-${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload Debian 13 relay release candidate
        id: upload_candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.candidate.outputs.artifact_name }}
          path: |
            ${{ env.BUNDLE_DIR }}/release-candidate.json
            ${{ env.BUNDLE_DIR }}/happy-relay-server-${{ env.VERSION }}-debian13-amd64.tar.gz
            ${{ env.BUNDLE_DIR }}/happy-relay-server-${{ env.VERSION }}-debian13-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
