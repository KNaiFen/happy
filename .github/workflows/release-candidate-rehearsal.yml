name: Rehearse release candidate chain

on:
  workflow_dispatch:
    inputs:
      product:
        description: Release product to build and promote under an explicit rehearsal name.
        required: true
        type: choice
        options:
          - cli
          - android
          - relay
          - agent
      source_sha:
        description: Exact merged main SHA whose first-attempt Required CI gate succeeded.
        required: true
        type: string
      source_run_id:
        description: Exact successful Happy monorepo CI run ID for source_sha.
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: release-rehearsal-${{ inputs.product }}-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  source_gate:
    name: Verify exact main CI gate
    if: >-
      github.run_attempt == 1 &&
      github.ref == 'refs/heads/main' &&
      inputs.source_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.gate.outputs.source_sha }}
      source_base_sha: ${{ steps.gate.outputs.source_base_sha }}
      source_run_id: ${{ steps.gate.outputs.source_run_id }}
      source_run_url: ${{ steps.gate.outputs.source_run_url }}
    steps:
      - name: Checkout gate verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Verify source workflow and Required CI gate
        id: gate
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: node scripts/ci/verify-release-source-gate.cjs

  versions:
    name: Read gated package versions
    needs: source_gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cli_version: ${{ steps.cli.outputs.version }}
      android_version: ${{ steps.android.outputs.version }}
      relay_version: ${{ steps.relay.outputs.version }}
      agent_version: ${{ steps.agent.outputs.version }}
    env:
      SOURCE_SHA: ${{ needs.source_gate.outputs.source_sha }}
      SOURCE_BASE_SHA: ${{ needs.source_gate.outputs.source_base_sha }}
    steps:
      - name: Checkout exact gated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify merged pull request base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git cat-file -e "${SOURCE_BASE_SHA}^{commit}"

      - name: Read CLI version
        id: cli
        run: node scripts/ci/detect-package-version-change.cjs packages/happy-cli/package.json "$SOURCE_BASE_SHA"

      - name: Read Android version
        id: android
        run: node scripts/ci/detect-package-version-change.cjs packages/happy-app/package.json "$SOURCE_BASE_SHA"

      - name: Read Relay version
        id: relay
        run: node scripts/ci/detect-package-version-change.cjs packages/happy-server/package.json "$SOURCE_BASE_SHA"

      - name: Read happy-agent version
        id: agent
        run: node scripts/ci/detect-package-version-change.cjs packages/happy-agent/package.json "$SOURCE_BASE_SHA"

  cli:
    name: Build rehearsed CLI candidate
    needs: [source_gate, versions]
    if: inputs.product == 'cli'
    uses: ./.github/workflows/build-cli-release.yml
    with:
      source_sha: ${{ needs.source_gate.outputs.source_sha }}
      version: ${{ needs.versions.outputs.cli_version }}

  android:
    name: Build rehearsed Android candidate
    needs: [source_gate, versions]
    if: inputs.product == 'android'
    uses: ./.github/workflows/build-android-release.yml
    with:
      source_sha: ${{ needs.source_gate.outputs.source_sha }}
      version: ${{ needs.versions.outputs.android_version }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

  relay:
    name: Build rehearsed Debian relay candidate
    needs: [source_gate, versions]
    if: inputs.product == 'relay'
    uses: ./.github/workflows/build-debian13-relay-release.yml
    with:
      source_sha: ${{ needs.source_gate.outputs.source_sha }}
      version: ${{ needs.versions.outputs.relay_version }}

  agent:
    name: Build rehearsed happy-agent candidate
    needs: [source_gate, versions]
    if: inputs.product == 'agent'
    uses: ./.github/workflows/build-happy-agent-release.yml
    with:
      source_sha: ${{ needs.source_gate.outputs.source_sha }}
      version: ${{ needs.versions.outputs.agent_version }}

  promote_cli:
    name: Promote rehearsed CLI candidate
    needs: [source_gate, versions, cli]
    if: needs.cli.result == 'success'
    uses: ./.github/workflows/promote-release-candidate.yml
    with:
      source_sha: ${{ needs.source_gate.outputs.source_sha }}
      product: cli
      version: ${{ needs.versions.outputs.cli_version }}
      candidate_artifact_id: ${{ needs.cli.outputs.candidate_artifact_id }}
      candidate_artifact_digest: ${{ needs.cli.outputs.candidate_artifact_digest }}
      candidate_artifact_name: ${{ needs.cli.outputs.candidate_artifact_name }}
      promotion_mode: rehearsal
      promotion_artifact_name: release-rehearsal-cli-${{ needs.versions.outputs.cli_version }}-${{ needs.source_gate.outputs.source_sha }}-${{ github.run_id }}
      promotion_retention_days: 1

  promote_android:
    name: Promote rehearsed Android candidate
    needs: [source_gate, versions, android]
    if: needs.android.result == 'success'
    uses: ./.github/workflows/promote-release-candidate.yml
    with:
      source_sha: ${{ needs.source_gate.outputs.source_sha }}
      product: android
      version: ${{ needs.versions.outputs.android_version }}
      candidate_artifact_id: ${{ needs.android.outputs.candidate_artifact_id }}
      candidate_artifact_digest: ${{ needs.android.outputs.candidate_artifact_digest }}
      candidate_artifact_name: ${{ needs.android.outputs.candidate_artifact_name }}
      promotion_mode: rehearsal
      promotion_artifact_name: release-rehearsal-android-${{ needs.versions.outputs.android_version }}-${{ needs.source_gate.outputs.source_sha }}-${{ github.run_id }}
      promotion_retention_days: 1

  promote_relay:
    name: Promote rehearsed Debian relay candidate
    needs: [source_gate, versions, relay]
    if: needs.relay.result == 'success'
    uses: ./.github/workflows/promote-release-candidate.yml
    with:
      source_sha: ${{ needs.source_gate.outputs.source_sha }}
      product: relay
      version: ${{ needs.versions.outputs.relay_version }}
      candidate_artifact_id: ${{ needs.relay.outputs.candidate_artifact_id }}
      candidate_artifact_digest: ${{ needs.relay.outputs.candidate_artifact_digest }}
      candidate_artifact_name: ${{ needs.relay.outputs.candidate_artifact_name }}
      promotion_mode: rehearsal
      promotion_artifact_name: release-rehearsal-relay-${{ needs.versions.outputs.relay_version }}-${{ needs.source_gate.outputs.source_sha }}-${{ github.run_id }}
      promotion_retention_days: 1

  promote_agent:
    name: Promote rehearsed happy-agent candidate
    needs: [source_gate, versions, agent]
    if: needs.agent.result == 'success'
    uses: ./.github/workflows/promote-release-candidate.yml
    with:
      source_sha: ${{ needs.source_gate.outputs.source_sha }}
      product: agent
      version: ${{ needs.versions.outputs.agent_version }}
      candidate_artifact_id: ${{ needs.agent.outputs.candidate_artifact_id }}
      candidate_artifact_digest: ${{ needs.agent.outputs.candidate_artifact_digest }}
      candidate_artifact_name: ${{ needs.agent.outputs.candidate_artifact_name }}
      promotion_mode: rehearsal
      promotion_artifact_name: release-rehearsal-agent-${{ needs.versions.outputs.agent_version }}-${{ needs.source_gate.outputs.source_sha }}-${{ github.run_id }}
      promotion_retention_days: 1

  rehearsal_gate:
    name: Release rehearsal gate
    needs:
      - source_gate
      - versions
      - cli
      - android
      - relay
      - agent
      - promote_cli
      - promote_android
      - promote_relay
      - promote_agent
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SELECTED_PRODUCT: ${{ inputs.product }}
      SOURCE_GATE_RESULT: ${{ needs.source_gate.result }}
      VERSIONS_RESULT: ${{ needs.versions.result }}
      CLI_BUILD_RESULT: ${{ needs.cli.result }}
      CLI_PROMOTION_RESULT: ${{ needs.promote_cli.result }}
      ANDROID_BUILD_RESULT: ${{ needs.android.result }}
      ANDROID_PROMOTION_RESULT: ${{ needs.promote_android.result }}
      RELAY_BUILD_RESULT: ${{ needs.relay.result }}
      RELAY_PROMOTION_RESULT: ${{ needs.promote_relay.result }}
      AGENT_BUILD_RESULT: ${{ needs.agent.result }}
      AGENT_PROMOTION_RESULT: ${{ needs.promote_agent.result }}
    steps:
      - name: Require exactly one successful rehearsal path
        run: |
          set -euo pipefail
          test "$SOURCE_GATE_RESULT" = success
          test "$VERSIONS_RESULT" = success
          case "$SELECTED_PRODUCT" in
            cli|android|relay|agent) ;;
            *) exit 1 ;;
          esac

          require_path() {
            local product="$1"
            local build_result="$2"
            local promotion_result="$3"
            if [ "$product" = "$SELECTED_PRODUCT" ]; then
              test "$build_result" = success
              test "$promotion_result" = success
            else
              test "$build_result" = skipped
              test "$promotion_result" = skipped
            fi
          }

          require_path cli "$CLI_BUILD_RESULT" "$CLI_PROMOTION_RESULT"
          require_path android "$ANDROID_BUILD_RESULT" "$ANDROID_PROMOTION_RESULT"
          require_path relay "$RELAY_BUILD_RESULT" "$RELAY_PROMOTION_RESULT"
          require_path agent "$AGENT_BUILD_RESULT" "$AGENT_PROMOTION_RESULT"

          {
            echo "product=$SELECTED_PRODUCT"
            echo "source_sha=${{ needs.source_gate.outputs.source_sha }}"
            echo "source_run_url=${{ needs.source_gate.outputs.source_run_url }}"
            echo "result=success"
          } >> "$GITHUB_STEP_SUMMARY"
