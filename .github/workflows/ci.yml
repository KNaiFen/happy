name: Happy monorepo CI

on:
  push:
    branches: [main]
    paths:
      - "packages/happy-wire/**"
      - "packages/happy-agent/**"
      - "packages/codium/**"
      - "packages/happy-server/**"
      - "packages/happy-cli/**"
      - "packages/happy-app/**"
      - ".dockerignore"
      - "Dockerfile.server"
      - "scripts/ci/**"
      - "scripts/postinstall.cjs"
      - "patches/**"
      - ".npmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/**"
      - "!**/*.md"
      - "!**/*.mdx"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: happy-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Classify CI changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      wire: ${{ steps.changes.outputs.wire }}
      agent: ${{ steps.changes.outputs.agent }}
      codium: ${{ steps.changes.outputs.codium }}
      codium_runtime: ${{ steps.changes.outputs.codium_runtime }}
      server: ${{ steps.changes.outputs.server }}
      cli: ${{ steps.changes.outputs.cli }}
      app: ${{ steps.changes.outputs.app }}
      tauri: ${{ steps.changes.outputs.tauri }}
      migration: ${{ steps.changes.outputs.migration }}
      official_codex: ${{ steps.changes.outputs.official_codex }}
      protocol_drift: ${{ steps.changes.outputs.protocol_drift }}
      codex_transport_scenarios: ${{ steps.changes.outputs.codex_transport_scenarios }}
      codex_official_app_server: ${{ steps.changes.outputs.codex_official_app_server }}
      codex_gateway_tui: ${{ steps.changes.outputs.codex_gateway_tui }}
      dependency_audit: ${{ steps.changes.outputs.dependency_audit }}
      codex_provider_boundary: ${{ steps.changes.outputs.codex_provider_boundary }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify changed paths
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/ci/classify-workflow-changes.cjs "$BASE_SHA" "$HEAD_SHA" "$FORCE_ALL"

      - name: Test release and workflow security gates
        run: |
          node --test scripts/ci/android-field-run-dedup.test.cjs
          node --test scripts/ci/android-field-apk-reuse.test.cjs
          node --test packages/happy-app/mobileFieldConfig.test.cjs
          node --test scripts/ci/mobile-field-credential-server.test.cjs
          node --test scripts/ci/workflow-action-security.test.cjs
          node --test scripts/ci/audit-production-dependencies.test.cjs
          node --test scripts/ci/codeql-change-classifier.test.cjs
          node --test scripts/ci/standalone-server-container-contract.test.cjs
          node --test scripts/ci/verify-release-source-gate.test.cjs
          node --test scripts/ci/release-candidate-promotion.test.cjs
          python3 scripts/ci/android_field_apk_archive_test.py
          python3 scripts/ci/release_candidate_archive_test.py

  wire:
    name: Wire typecheck, test, and build
    needs: classify
    if: needs.classify.outputs.wire == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Wire
        run: pnpm --filter @slopus/happy-wire typecheck

      - name: Test and build Wire
        run: pnpm --filter @slopus/happy-wire test

  agent:
    name: Agent typecheck, test, and build
    needs: classify
    if: needs.classify.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Wire dependency
        run: pnpm --filter @slopus/happy-wire build

      - name: Typecheck Agent
        run: pnpm --filter happy-agent typecheck

      - name: Test and build Agent
        run: pnpm --filter happy-agent test

  codium:
    name: Codium typecheck, test, and production build
    needs: classify
    if: needs.classify.outputs.codium == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Codium
        run: pnpm --filter codium typecheck

      - name: Test Codium source
        run: pnpm --filter codium test

      - name: Build Codium production bundle
        run: pnpm --filter codium build

  codium_codex_runtime:
    name: Codium bundled Codex runtime lifecycle
    needs: classify
    if: needs.classify.outputs.codium_runtime == 'true'
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Codium runtime source
        run: pnpm --filter codium typecheck

      - name: Typecheck Codium runtime fixture
        run: node node_modules/typescript/bin/tsc --project scripts/ci/tsconfig.codium-codex-runtime-smoke.json

      - name: Exercise packaged Codex binary through Responses fixture
        run: pnpm --filter codium exec tsx ../../scripts/ci/codium-codex-runtime-smoke.ts

  server:
    name: Server typecheck, test, and standalone image
    needs: classify
    if: needs.classify.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Wire dependency
        run: pnpm --filter @slopus/happy-wire build

      - name: Generate Prisma client
        run: pnpm --filter happy-server-self-host generate

      - name: Typecheck Server
        run: pnpm --filter happy-server-self-host typecheck

      - name: Test Server
        run: pnpm --filter happy-server-self-host test

      - name: Build and exercise standalone Docker image
        env:
          IMAGE: happy-server-standalone:${{ github.sha }}
        run: |
          SERVER_VERSION="$(node -p "require('./packages/happy-server/package.json').version")"
          shellcheck scripts/ci/test-standalone-server-container.sh
          docker build \
            --file Dockerfile.server \
            --tag "$IMAGE" \
            --build-arg "HAPPY_SERVER_VERSION=$SERVER_VERSION" \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --build-arg "SOURCE_URL=https://github.com/$GITHUB_REPOSITORY" \
            .
          GITHUB_ACTIONS=true scripts/ci/test-standalone-server-container.sh "$IMAGE"

  cli:
    name: CLI typecheck, unit test, and build
    needs: classify
    if: needs.classify.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Wire dependency
        run: pnpm --filter @slopus/happy-wire build

      - name: Typecheck CLI
        run: pnpm --filter happy typecheck

      - name: Test and build CLI
        run: pnpm --filter happy test

  app:
    name: App typecheck, unit test, and Web build
    needs: classify
    if: needs.classify.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_ENV: production
      NODE_ENV: production
      HAPPY_DISABLE_OTA: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Wire dependency
        run: pnpm --filter @slopus/happy-wire build

      - name: Typecheck App
        run: pnpm --filter happy-app typecheck

      - name: Test App
        run: pnpm --filter happy-app exec vitest run

      - name: Verify HTTP platform policy
        run: |
          pnpm --filter happy-app exec expo config --type public --json > "$RUNNER_TEMP/happy-app-config.json"
          node scripts/ci/verify-http-platform-config.cjs "$RUNNER_TEMP/happy-app-config.json"

      - name: Export Web App
        run: pnpm --filter happy-app exec expo export --platform web --output-dir "$RUNNER_TEMP/happy-app-web"

      - name: Verify Web output
        run: test -f "$RUNNER_TEMP/happy-app-web/index.html"

  tauri:
    name: macOS Tauri Rust format, check, and test
    needs: classify
    if: needs.classify.outputs.tauri == 'true'
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Reject Tauri Cargo lockfile drift
        run: |
          cargo metadata --format-version 1 --manifest-path packages/happy-app/src-tauri/Cargo.toml > /dev/null
          git diff --exit-code -- packages/happy-app/src-tauri/Cargo.lock

      - name: Check Rust formatting
        run: cargo fmt --manifest-path packages/happy-app/src-tauri/Cargo.toml -- --check

      - name: Check Tauri native transport
        run: cargo check --locked --manifest-path packages/happy-app/src-tauri/Cargo.toml

      - name: Test Tauri native transport
        run: cargo test --locked --lib --manifest-path packages/happy-app/src-tauri/Cargo.toml

  migration:
    name: PostgreSQL migration deploy and upgrade
    needs: classify
    if: needs.classify.outputs.migration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: happy
          POSTGRES_PASSWORD: happy
          POSTGRES_DB: happy_sync_v4_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U happy -d happy_sync_v4_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://happy:happy@127.0.0.1:5432/happy_sync_v4_migration_test
      HAPPY_MIGRATION_TEST_ALLOW_RESET: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify clean deploy, old-schema upgrade, and drift
        run: pnpm --filter happy-server-self-host test:migration:sync-v4

  official_codex:
    name: Build latest stable official Codex source
    needs: classify
    if: needs.classify.outputs.official_codex == 'true'
    uses: ./.github/workflows/build-official-codex-source.yml

  protocol-drift:
    name: Codex 0.145.0 stable-v2 protocol drift
    needs: classify
    if: needs.classify.outputs.protocol_drift == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Codex CLI
        run: |
          npm install --global @openai/codex@0.145.0
          CODEX_BIN="$(npm prefix --global)/bin/codex"
          test -x "$CODEX_BIN"
          test "$(timeout 10s "$CODEX_BIN" --version)" = "codex-cli 0.145.0"
          printf 'HAPPY_CODEX_PROTOCOL_BIN=%s\n' "$CODEX_BIN" >> "$GITHUB_ENV"

      - name: Regenerate stable-v2 protocol
        run: pnpm --filter happy codex:protocol:generate

      - name: Reject generated protocol drift
        run: git diff --exit-code -- packages/happy-cli/src/codex/protocol/generated

  codex_transport_scenarios:
    name: Codex fake-provider transport fault scenarios
    needs: classify
    if: needs.classify.outputs.codex_transport_scenarios == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies with a bounded lifecycle
        run: |
          set -euo pipefail
          install_status=0
          timeout --kill-after=30s 5m pnpm install --frozen-lockfile || install_status=$?
          if test "$install_status" -ne 0; then
            echo "pnpm install failed or exceeded its five-minute lifecycle bound (status $install_status)." >&2
            exit "$install_status"
          fi

      - name: Build Wire dependency
        run: pnpm --filter @slopus/happy-wire build

      - name: Exercise real Happy relay with deterministic fake provider faults
        run: pnpm --filter happy test:codex-http-relay

      - name: Exercise fake Codex, CLI mapper, and durable transport faults
        run: >-
          pnpm --filter happy exec vitest run --project unit
          src/codex/fakeCodexAppServer.test.ts
          src/codex/codexSyncV4Mapper.test.ts
          src/codex/codexV4ThreadRouter.test.ts
          src/codex/codexThreadHistory.test.ts
          src/codex/codexThreadOpenCoordinator.test.ts
          src/api/apiMachine.codexFork.test.ts
          src/api/syncV4Client.test.ts

      - name: Exercise relay ordering, idempotency, and snapshot recovery
        run: >-
          pnpm --filter happy-server-self-host exec vitest run
          sources/app/api/routes/sessionRoutes.machineOrigin.spec.ts
          sources/app/api/routes/v4SessionRoutes.spec.ts

      - name: Exercise App persistence and projection recovery
        run: >-
          pnpm --filter happy-app exec vitest run
          sources/sync/codexThreadHistory.spec.ts
          sources/sync/encryption/encryption.codexResume.spec.ts
          sources/sync/syncV4Client.spec.ts
          sources/sync/codexV4Projection.spec.ts
          sources/sync/codexV4Activity.spec.ts
          sources/sync/sessionArchiveCoordinator.spec.ts
          sources/hooks/useGroupedMessages.test.ts

  codex_official_app_server:
    name: Official Codex app-server lifecycle
    needs: [classify, official_codex]
    if: needs.classify.outputs.codex_official_app_server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAPPY_SCENARIO_CODEX_VERSION: ${{ needs.official_codex.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Wire dependency
        run: pnpm --filter @slopus/happy-wire build

      - name: Typecheck official Codex fixtures from source
        run: node node_modules/typescript/bin/tsc --project scripts/ci/tsconfig.codex-official.json

      - name: Test official Codex fixture helpers from source
        run: |
          node --test scripts/ci/codex-mobile-recovery-launch.test.cjs
          node --test scripts/ci/official-codex-artifact-reuse.test.cjs
          node node_modules/vitest/vitest.mjs run \
            scripts/ci/codex-responses-fixture.test.ts \
            scripts/ci/codex-mobile-field-command-correlation.test.ts

      - name: Download exact source-built official Codex
        env:
          GH_TOKEN: ${{ github.token }}
          OFFICIAL_CODEX_ARTIFACT_ID: ${{ needs.official_codex.outputs.artifact_id }}
          OFFICIAL_CODEX_ARTIFACT_DIGEST: ${{ needs.official_codex.outputs.artifact_digest }}
        run: >-
          node scripts/ci/official-codex-artifact-reuse.cjs download
          "$OFFICIAL_CODEX_ARTIFACT_ID" "$OFFICIAL_CODEX_ARTIFACT_DIGEST"
          "$RUNNER_TEMP/official-codex"

      - name: Validate official Codex artifact content
        run: >-
          node scripts/ci/official-codex-artifact-reuse.cjs verify
          "$RUNNER_TEMP/official-codex" "${{ needs.official_codex.outputs.attested_happy_source_sha }}"
          "${{ needs.official_codex.outputs.commit }}"
          "${{ needs.official_codex.outputs.recipe_fingerprint }}"
          "${{ needs.official_codex.outputs.attestation_run_id }}"

      - name: Verify official Codex provenance
        run: |
          CODEX_BIN="$RUNNER_TEMP/official-codex/bin/codex"
          CODE_MODE_HOST="$RUNNER_TEMP/official-codex/bin/codex-code-mode-host"
          BWRAP="$RUNNER_TEMP/official-codex/bin/codex-resources/bwrap"
          chmod 0755 "$CODEX_BIN" "$CODE_MODE_HOST" "$BWRAP"
          test -x "$CODEX_BIN"
          test -x "$CODE_MODE_HOST"
          test -x "$BWRAP"
          test "$(timeout 15s "$CODEX_BIN" --version)" = \
            "codex-cli $HAPPY_SCENARIO_CODEX_VERSION"
          test "$(jq -r '.version' "$RUNNER_TEMP/official-codex/source.json")" = \
            "${{ needs.official_codex.outputs.version }}"
          test "$(jq -r '.commit' "$RUNNER_TEMP/official-codex/source.json")" = \
            "${{ needs.official_codex.outputs.commit }}"
          test "$(jq -r '.runtimeBundleVersion' "$RUNNER_TEMP/official-codex/source.json")" = 2
          test "$(jq -r '.bwrapSha256' "$RUNNER_TEMP/official-codex/source.json")" = \
            "$(sha256sum "$BWRAP" | cut -d' ' -f1)"
          printf 'HAPPY_SCENARIO_CODEX_BIN=%s\n' "$CODEX_BIN" >> "$GITHUB_ENV"

      - name: Enable official Linux sandbox user namespaces
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Exercise project instructions, tool, reasoning, stream, and completion lifecycle
        run: pnpm --filter happy test:codex-official-app-server

  codex_gateway_tui:
    name: Official Codex TUI Gateway round trip
    needs: [classify, official_codex]
    if: needs.classify.outputs.codex_gateway_tui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HAPPY_SCENARIO_CODEX_VERSION: ${{ needs.official_codex.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Wire and CLI runtime
        run: |
          pnpm --filter @slopus/happy-wire build
          pnpm --filter happy build

      - name: Generate relay Prisma client
        run: pnpm --filter happy-server-self-host generate

      - name: Typecheck TUI fixture and PTY tests from source
        run: node node_modules/typescript/bin/tsc --project scripts/ci/tsconfig.codex-gateway-tui.json

      - name: Download exact source-built official Codex
        env:
          GH_TOKEN: ${{ github.token }}
          OFFICIAL_CODEX_ARTIFACT_ID: ${{ needs.official_codex.outputs.artifact_id }}
          OFFICIAL_CODEX_ARTIFACT_DIGEST: ${{ needs.official_codex.outputs.artifact_digest }}
        run: >-
          node scripts/ci/official-codex-artifact-reuse.cjs download
          "$OFFICIAL_CODEX_ARTIFACT_ID" "$OFFICIAL_CODEX_ARTIFACT_DIGEST"
          "$RUNNER_TEMP/official-codex"

      - name: Validate official Codex artifact content
        run: >-
          node scripts/ci/official-codex-artifact-reuse.cjs verify
          "$RUNNER_TEMP/official-codex" "${{ needs.official_codex.outputs.attested_happy_source_sha }}"
          "${{ needs.official_codex.outputs.commit }}"
          "${{ needs.official_codex.outputs.recipe_fingerprint }}"
          "${{ needs.official_codex.outputs.attestation_run_id }}"

      - name: Verify official Codex provenance
        run: |
          CODEX_BIN="$RUNNER_TEMP/official-codex/bin/codex"
          CODE_MODE_HOST="$RUNNER_TEMP/official-codex/bin/codex-code-mode-host"
          BWRAP="$RUNNER_TEMP/official-codex/bin/codex-resources/bwrap"
          chmod 0755 "$CODEX_BIN" "$CODE_MODE_HOST" "$BWRAP"
          test -x "$CODEX_BIN"
          test -x "$CODE_MODE_HOST"
          test -x "$BWRAP"
          test "$(timeout 15s "$CODEX_BIN" --version)" = \
            "codex-cli $HAPPY_SCENARIO_CODEX_VERSION"
          test "$(jq -r '.version' "$RUNNER_TEMP/official-codex/source.json")" = \
            "${{ needs.official_codex.outputs.version }}"
          test "$(jq -r '.commit' "$RUNNER_TEMP/official-codex/source.json")" = \
            "${{ needs.official_codex.outputs.commit }}"
          test "$(jq -r '.runtimeBundleVersion' "$RUNNER_TEMP/official-codex/source.json")" = 2
          test "$(jq -r '.bwrapSha256' "$RUNNER_TEMP/official-codex/source.json")" = \
            "$(sha256sum "$BWRAP" | cut -d' ' -f1)"
          printf 'HAPPY_SCENARIO_CODEX_BIN=%s\n' "$CODEX_BIN" >> "$GITHUB_ENV"

      - name: Enable official Linux sandbox user namespaces
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Exercise terminal, App, 11-minute idle, attach, and normal stop through a real PTY
        run: pnpm --filter happy test:codex-gateway-tui
        env:
          HAPPY_GATEWAY_TUI_ARTIFACT_DIR: ${{ runner.temp }}/happy-gateway-tui-artifacts

      - name: Upload TUI traces and fixture diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-gateway-tui-diagnostics
          path: |
            ${{ runner.temp }}/happy-gateway-tui-artifacts/fixture.log
            ${{ runner.temp }}/happy-gateway-tui-artifacts/gateway-status.json
            ${{ runner.temp }}/happy-gateway-tui-artifacts/tui-traces
          if-no-files-found: warn
          retention-days: 7

  dependency-audit:
    name: Production dependency high audit
    needs: classify
    if: needs.classify.outputs.dependency_audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Audit production dependencies
        run: node scripts/ci/audit-production-dependencies.cjs

  codex_provider_boundary:
    name: Codex-only provider boundary
    needs: classify
    if: needs.classify.outputs.codex_provider_boundary == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Test provider boundary allowlist
        run: node --test scripts/ci/assert-codex-only-provider.test.cjs

      - name: Reject removed provider code, instructions, and active documentation
        run: node scripts/ci/assert-codex-only-provider.cjs

  ci-gate:
    name: Required CI gate
    if: always()
    needs:
      - classify
      - wire
      - agent
      - codium
      - codium_codex_runtime
      - server
      - cli
      - app
      - tauri
      - migration
      - official_codex
      - protocol-drift
      - codex_transport_scenarios
      - codex_official_app_server
      - codex_gateway_tui
      - dependency-audit
      - codex_provider_boundary
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected CI job to pass
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          EXPECT_WIRE: ${{ needs.classify.outputs.wire }}
          WIRE_RESULT: ${{ needs.wire.result }}
          EXPECT_AGENT: ${{ needs.classify.outputs.agent }}
          AGENT_RESULT: ${{ needs.agent.result }}
          EXPECT_CODIUM: ${{ needs.classify.outputs.codium }}
          CODIUM_RESULT: ${{ needs.codium.result }}
          EXPECT_CODIUM_RUNTIME: ${{ needs.classify.outputs.codium_runtime }}
          CODIUM_RUNTIME_RESULT: ${{ needs.codium_codex_runtime.result }}
          EXPECT_SERVER: ${{ needs.classify.outputs.server }}
          SERVER_RESULT: ${{ needs.server.result }}
          EXPECT_CLI: ${{ needs.classify.outputs.cli }}
          CLI_RESULT: ${{ needs.cli.result }}
          EXPECT_APP: ${{ needs.classify.outputs.app }}
          APP_RESULT: ${{ needs.app.result }}
          EXPECT_TAURI: ${{ needs.classify.outputs.tauri }}
          TAURI_RESULT: ${{ needs.tauri.result }}
          EXPECT_MIGRATION: ${{ needs.classify.outputs.migration }}
          MIGRATION_RESULT: ${{ needs.migration.result }}
          EXPECT_OFFICIAL_CODEX: ${{ needs.classify.outputs.official_codex }}
          OFFICIAL_CODEX_RESULT: ${{ needs.official_codex.result }}
          EXPECT_PROTOCOL: ${{ needs.classify.outputs.protocol_drift }}
          PROTOCOL_RESULT: ${{ needs.protocol-drift.result }}
          EXPECT_SCENARIOS: ${{ needs.classify.outputs.codex_transport_scenarios }}
          SCENARIOS_RESULT: ${{ needs.codex_transport_scenarios.result }}
          EXPECT_OFFICIAL_APP_SERVER: ${{ needs.classify.outputs.codex_official_app_server }}
          OFFICIAL_APP_SERVER_RESULT: ${{ needs.codex_official_app_server.result }}
          EXPECT_CODEX_GATEWAY_TUI: ${{ needs.classify.outputs.codex_gateway_tui }}
          CODEX_GATEWAY_TUI_RESULT: ${{ needs.codex_gateway_tui.result }}
          EXPECT_AUDIT: ${{ needs.classify.outputs.dependency_audit }}
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          EXPECT_CODEX_BOUNDARY: ${{ needs.classify.outputs.codex_provider_boundary }}
          CODEX_BOUNDARY_RESULT: ${{ needs.codex_provider_boundary.result }}
        run: |
          require_result() {
            expected="$1"
            actual="$2"
            name="$3"
            if [ "$expected" = true ]; then wanted=success; else wanted=skipped; fi
            if [ "$actual" != "$wanted" ]; then
              echo "$name: expected $wanted, got $actual" >&2
              return 1
            fi
          }
          test "$CLASSIFY_RESULT" = success
          require_result "$EXPECT_WIRE" "$WIRE_RESULT" wire
          require_result "$EXPECT_AGENT" "$AGENT_RESULT" agent
          require_result "$EXPECT_CODIUM" "$CODIUM_RESULT" codium
          require_result "$EXPECT_CODIUM_RUNTIME" "$CODIUM_RUNTIME_RESULT" codium-runtime
          require_result "$EXPECT_SERVER" "$SERVER_RESULT" server
          require_result "$EXPECT_CLI" "$CLI_RESULT" cli
          require_result "$EXPECT_APP" "$APP_RESULT" app
          require_result "$EXPECT_TAURI" "$TAURI_RESULT" tauri
          require_result "$EXPECT_MIGRATION" "$MIGRATION_RESULT" migration
          require_result "$EXPECT_OFFICIAL_CODEX" "$OFFICIAL_CODEX_RESULT" official-codex
          require_result "$EXPECT_PROTOCOL" "$PROTOCOL_RESULT" protocol-drift
          require_result "$EXPECT_SCENARIOS" "$SCENARIOS_RESULT" transport-scenarios
          require_result "$EXPECT_OFFICIAL_APP_SERVER" "$OFFICIAL_APP_SERVER_RESULT" official-app-server
          require_result "$EXPECT_CODEX_GATEWAY_TUI" "$CODEX_GATEWAY_TUI_RESULT" gateway-tui
          require_result "$EXPECT_AUDIT" "$AUDIT_RESULT" dependency-audit
          require_result "$EXPECT_CODEX_BOUNDARY" "$CODEX_BOUNDARY_RESULT" provider-boundary
