appId: com.slopus.happy.dev
name: Codex Sync v4 Android field round trip
tags:
  - codex
  - sync-v4
  - field
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: Development Build
    timeout: 30000
- openLink:
    link: "exp+happy://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081&disableOnboarding=1"

- extendedWaitUntil:
    visible:
      id: empty-main-new-session
    timeout: 180000
- assertVisible:
    id: empty-main-machine-name
- tapOn:
    id: empty-main-new-session

- extendedWaitUntil:
    visible:
      id: new-session-agent-picker
    timeout: 15000
- tapOn:
    id: new-session-agent-picker
- extendedWaitUntil:
    visible:
      id: picker-option-codex
    timeout: 10000
- tapOn:
    id: picker-option-codex

- tapOn:
    id: new-session-prompt
- setClipboard: hello-from-android-e2e
- pasteText
- assertVisible: hello-from-android-e2e
- hideKeyboard
- tapOn:
    id: new-session-send

- extendedWaitUntil:
    visible: hello-from-android-e2e
    timeout: 30000
- extendedWaitUntil:
    visible: Fake Codex response
    timeout: 60000
- takeScreenshot: codex-first-reply

- pressKey: home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: Fake Codex response
    timeout: 30000

- pressKey: home
- killApp
- openLink:
    link: "exp+happy://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081&disableOnboarding=1"
- extendedWaitUntil:
    visible: hello-from-android-e2e
    timeout: 45000
- extendedWaitUntil:
    visible: Fake Codex response
    timeout: 45000
- takeScreenshot: codex-recovered-after-process-death
