appId: com.slopus.happy.dev
name: Codex Sync v4 Android field round trip
tags:
  - codex
  - sync-v4
  - field
---
- launchApp:
    stopApp: false

- extendedWaitUntil:
    visible:
      id: empty-main-new-session
    timeout: 180000
- assertVisible:
    id: empty-main-machine-name
- tapOn:
    id: empty-main-machine-details

- extendedWaitUntil:
    visible:
      id: machine-session-path
    timeout: 15000
- tapOn:
    id: machine-session-path
- setClipboard: "~"
- pasteText
- tapOn:
    id: machine-resume-history

- extendedWaitUntil:
    visible: resume-history-from-android-e2e
    timeout: 60000
- tapOn: resume-history-from-android-e2e
- extendedWaitUntil:
    visible:
      id: codex-resume-confirm
    timeout: 60000
- tapOn:
    id: codex-resume-confirm

- waitForAnimationToEnd:
    timeout: 10000
- runFlow:
    when:
      visible: Enjoying the app?
    commands:
      - tapOn: NOT REALLY

- extendedWaitUntil:
    visible:
      id: agent-input-message
    timeout: 90000
- scrollUntilVisible:
    element: resume-history-from-android-e2e
    direction: UP
    timeout: 60000
- assertVisible: resume-history-from-android-e2e
- scrollUntilVisible:
    element: Official Codex source E2E response
    direction: DOWN
    timeout: 60000
- assertVisible: Official Codex source E2E response

- assertVisible: yolo
- tapOn:
    # The Android native settings trigger is a Compose menu without a stable
    # accessibility node. Image upload is disabled in this fixture, so the
    # permission gear is the first fixed slot in the pinned Pixel 7 composer.
    point: "10%,93%"
- extendedWaitUntil:
    visible: default permissions
    timeout: 15000
- tapOn: default permissions
- extendedWaitUntil:
    notVisible: yolo
    timeout: 15000

- tapOn:
    id: agent-input-message
- setClipboard: H
- pasteText
- assertVisible: H
- hideKeyboard
- tapOn:
    id: agent-input-send

- runFlow:
    when:
      visible: Enjoying the app?
    commands:
      - tapOn: NOT REALLY

- extendedWaitUntil:
    visible:
      text: Choose the restart-safe field option
    timeout: 60000
- assertVisible: Waiting for you
- assertVisible:
    text: Resume after restart
    checked: false
- assertNotVisible: Used 2 tools
- takeScreenshot: codex-live-pending-elicitation

- assertNotVisible: Queue
- assertNotVisible: Steer

- tapOn:
    id: agent-input-message
- setClipboard: Q
- pasteText
- assertVisible: Q
- hideKeyboard
- tapOn:
    id: agent-input-send
- extendedWaitUntil:
    visible:
      id: "codex-queued-message-more-.*"
    timeout: 30000
- assertVisible: Send to active turn
- assertVisible: Remove queued message
- assertVisible: Q
- tapOn:
    id: "codex-queued-message-more-.*"
- extendedWaitUntil:
    visible: Edit queued message
    timeout: 30000
- assertVisible: Send to active turn
- assertVisible: Remove queued message
- takeScreenshot: codex-queued-follow-up
- tapOn:
    id: codex-queued-message-menu-dismiss
- takeScreenshot: codex-pending-elicitation-with-queue
- pressKey: home
- killApp
