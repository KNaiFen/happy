appId: com.slopus.happy.dev
name: Codex Sync v4 Android field round trip
tags:
  - codex
  - sync-v4
  - field
---
- launchApp:
    stopApp: false

- extendedWaitUntil:
    visible:
      id: empty-main-new-session
    timeout: 180000
- assertVisible:
    id: empty-main-machine-name
- tapOn:
    id: empty-main-new-session

- extendedWaitUntil:
    visible:
      id: new-session-agent-picker
    timeout: 15000
- tapOn:
    id: new-session-agent-picker
- extendedWaitUntil:
    visible:
      id: picker-option-codex
    timeout: 10000
- tapOn:
    id: picker-option-codex

- tapOn:
    id: new-session-prompt
- setClipboard: hello-from-android-e2e
- pasteText
- assertVisible: hello-from-android-e2e
- hideKeyboard
- tapOn:
    id: new-session-send

- extendedWaitUntil:
    visible: Enjoying the app?
    timeout: 30000
- tapOn: Not really

- scrollUntilVisible:
    element: hello-from-android-e2e
    direction: UP
    timeout: 30000
- assertVisible: hello-from-android-e2e
- scrollUntilVisible:
    element: Official Codex source E2E response
    direction: DOWN
    timeout: 60000
- assertVisible: Official Codex source E2E response
- assertNotVisible: Plan mode with options
- assertNotVisible: Based on this message, call
- assertNotVisible: <happy-system>
- takeScreenshot: codex-first-reply

- pressKey: home
- launchApp:
    stopApp: false
- scrollUntilVisible:
    element: Official Codex source E2E response
    direction: DOWN
    timeout: 30000
- assertVisible: Official Codex source E2E response
- assertNotVisible: Plan mode with options
- assertNotVisible: Based on this message, call
- assertNotVisible: <happy-system>

- pressKey: home
- killApp
