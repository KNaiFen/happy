appId: com.slopus.happy.dev
name: Codex Sync v4 Android field round trip
tags:
  - codex
  - sync-v4
  - field
---
- launchApp:
    stopApp: false

- extendedWaitUntil:
    visible:
      id: empty-main-new-session
    timeout: 180000
- assertVisible:
    id: empty-main-machine-name
- tapOn:
    id: empty-main-machine-details

- extendedWaitUntil:
    visible:
      id: machine-session-path
    timeout: 15000
- tapOn:
    id: machine-session-path
- setClipboard: "~"
- pasteText
- tapOn:
    id: machine-resume-history

- extendedWaitUntil:
    visible: resume-history-from-android-e2e
    timeout: 60000
- tapOn: resume-history-from-android-e2e
- extendedWaitUntil:
    visible:
      id: codex-resume-confirm
    timeout: 60000
- tapOn:
    id: codex-resume-confirm

- waitForAnimationToEnd:
    timeout: 10000
- runFlow:
    when:
      visible: Enjoying the app?
    commands:
      - tapOn: NOT REALLY

- extendedWaitUntil:
    visible:
      id: agent-input-message
    timeout: 90000
- scrollUntilVisible:
    element: resume-history-from-android-e2e
    direction: UP
    timeout: 60000
- assertVisible: resume-history-from-android-e2e
- scrollUntilVisible:
    element: Official Codex source E2E response
    direction: DOWN
    timeout: 60000
- assertVisible: Official Codex source E2E response

- tapOn:
    id: agent-input-message
- setClipboard: H
- pasteText
- assertVisible: H
- hideKeyboard
- tapOn:
    id: agent-input-send

- runFlow:
    when:
      visible: Enjoying the app?
    commands:
      - tapOn: NOT REALLY

- extendedWaitUntil:
    visible:
      id: codex-mcp-tool-message
    timeout: 60000
- assertNotVisible: Used 2 tools
- takeScreenshot: codex-live-single-mcp

- extendedWaitUntil:
    visible:
      text: Queue
      checked: true
    timeout: 30000
- assertVisible:
    text: Steer
    enabled: true
- tapOn:
    text: Steer
    enabled: true
- assertVisible:
    text: Steer
    checked: true
- tapOn: Queue
- assertVisible:
    text: Queue
    checked: true

- tapOn:
    id: agent-input-message
- setClipboard: Q
- pasteText
- assertVisible: Q
- hideKeyboard
- tapOn:
    id: agent-input-send
- extendedWaitUntil:
    visible: Edit queued message
    timeout: 30000
- assertVisible: Send to active turn
- assertVisible: Q
- takeScreenshot: codex-queued-follow-up
- extendedWaitUntil:
    notVisible: Edit queued message
    timeout: 120000

- scrollUntilVisible:
    element: Official Codex MCP E2E response
    direction: DOWN
    timeout: 60000
- assertVisible: Official Codex MCP E2E response
- assertNotVisible: Used 2 tools
- assertNotVisible: Plan mode with options
- assertNotVisible: Based on this message, call
- assertNotVisible: <happy-system>
- takeScreenshot: codex-first-reply

- tapOn:
    id: agent-input-message
- setClipboard: /compact
- pasteText
- hideKeyboard
- tapOn:
    id: agent-input-send
- extendedWaitUntil:
    visible:
      id: codex-timeline-context-compaction
    timeout: 60000
- assertNotVisible: CodexControlCommand
- assertNotVisible: CodexCompact
- takeScreenshot: codex-context-compaction

- pressKey: home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: New chat
    timeout: 45000
- extendedWaitUntil:
    notVisible:
      id: empty-main-new-session
    timeout: 45000
- runFlow:
    when:
      visible: Terminals
    commands:
      - tapOn: New chat
- extendedWaitUntil:
    notVisible: Terminals
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: agent-input-message
    timeout: 45000
- runFlow:
    when:
      visible:
        id: "com.google.android.inputmethod.latin:id/0_resource_name_obfuscated"
    commands:
      - hideKeyboard
- scrollUntilVisible:
    element:
      id: codex-timeline-context-compaction
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: codex-timeline-context-compaction
- scrollUntilVisible:
    element: Official Codex MCP E2E response
    direction: UP
    timeout: 60000
- assertVisible: Official Codex MCP E2E response
- assertNotVisible: Used 2 tools
- assertNotVisible: CodexControlCommand
- assertNotVisible: CodexCompact
- assertNotVisible: Plan mode with options
- assertNotVisible: Based on this message, call
- assertNotVisible: <happy-system>

- pressKey: home
- killApp
