appId: com.slopus.happy.dev
name: Codex Sync v4 Android field round trip
tags:
  - codex
  - sync-v4
  - field
---
- launchApp:
    stopApp: false

- extendedWaitUntil:
    visible:
      id: empty-main-new-session
    timeout: 180000
- assertVisible:
    id: empty-main-machine-name
- tapOn:
    id: empty-main-machine-details

- extendedWaitUntil:
    visible:
      id: machine-session-path
    timeout: 15000
- tapOn:
    id: machine-session-path
- setClipboard: "~"
- pasteText
- hideKeyboard
- tapOn:
    id: machine-resume-history

- extendedWaitUntil:
    visible: resume-history-from-android-e2e
    timeout: 60000
- tapOn: resume-history-from-android-e2e
- extendedWaitUntil:
    visible:
      id: codex-resume-confirm
    timeout: 60000
- tapOn:
    id: codex-resume-confirm

- extendedWaitUntil:
    visible:
      id: agent-input-message
    timeout: 90000
- scrollUntilVisible:
    element: resume-history-from-android-e2e
    direction: UP
    timeout: 60000
- assertVisible: resume-history-from-android-e2e
- scrollUntilVisible:
    element: Official Codex source E2E response
    direction: DOWN
    timeout: 60000
- assertVisible: Official Codex source E2E response

- tapOn:
    id: agent-input-message
- setClipboard: hello-from-android-e2e
- pasteText
- assertVisible: hello-from-android-e2e
- hideKeyboard
- tapOn:
    id: agent-input-send

- extendedWaitUntil:
    visible: Enjoying the app?
    timeout: 30000
- tapOn: Not really

- scrollUntilVisible:
    element: hello-from-android-e2e
    direction: UP
    timeout: 30000
- assertVisible: hello-from-android-e2e
- scrollUntilVisible:
    element: Official Codex source E2E response
    direction: DOWN
    timeout: 60000
- assertVisible: Official Codex source E2E response
- assertNotVisible: Plan mode with options
- assertNotVisible: Based on this message, call
- assertNotVisible: <happy-system>
- takeScreenshot: codex-first-reply

- pressKey: home
- launchApp:
    stopApp: false
- scrollUntilVisible:
    element: Official Codex source E2E response
    direction: DOWN
    timeout: 30000
- assertVisible: Official Codex source E2E response
- assertNotVisible: Plan mode with options
- assertNotVisible: Based on this message, call
- assertNotVisible: <happy-system>

- pressKey: home
- killApp
