appId: com.slopus.happy.dev
name: Codex Sync v4 Android recovery after process death
tags:
  - codex
  - sync-v4
  - field
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: New chat
    timeout: 45000
- extendedWaitUntil:
    notVisible:
      id: empty-main-new-session
    timeout: 45000
- runFlow:
    when:
      visible: Terminals
    commands:
      - tapOn: New chat
- extendedWaitUntil:
    notVisible: Terminals
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: agent-input-message
    timeout: 45000
- runFlow:
    when:
      visible:
        id: "com.google.android.inputmethod.latin:id/0_resource_name_obfuscated"
    commands:
      - hideKeyboard
- scrollUntilVisible:
    element: Choose the restart-safe field option
    direction: UP
    centerElement: true
    timeout: 60000
- assertVisible: '(?s).*Waiting for you.*'
- assertVisible:
    id: codex-queued-message-dock
- assertVisible: Q
- tapOn:
    text: '(?s).+, Resume after restart.*'
    checked: false
- assertVisible:
    text: '(?s).+, Resume after restart.*'
    checked: true
- takeScreenshot: codex-elicitation-restored-and-selected
- tapOn: Submit Answer
- extendedWaitUntil:
    visible: '(?s).*Field choice:.*'
    timeout: 60000
- assertVisible: resume
- assertNotVisible: '(?s).*Waiting for you.*'
- assertNotVisible: CodexControlCommand
- assertNotVisible: request.resolve
- extendedWaitUntil:
    notVisible:
      id: codex-queued-message-dock
    timeout: 150000
- scrollUntilVisible:
    element: Official Codex MCP E2E response
    direction: DOWN
    timeout: 150000
- assertVisible: Official Codex MCP E2E response
- scrollUntilVisible:
    element: Official Codex queued follow-up E2E response
    direction: DOWN
    timeout: 150000
- assertVisible: Official Codex queued follow-up E2E response
- assertNotVisible: CodexControlCommand
- assertNotVisible: request.resolve
- scrollUntilVisible:
    element:
      id: codex-mcp-tool-message
    direction: UP
    centerElement: true
    timeout: 60000
- tapOn:
    id: codex-mcp-tool-message
- extendedWaitUntil:
    # Maestro matches one accessibility text node. Tool output is a JSON node with newlines,
    # so require the marker anywhere in that visible node rather than assuming it is standalone.
    visible: '(?s).*MCP restart-safe field choice accepted.*'
    timeout: 45000
- back
- tapOn:
    id: agent-input-message
- setClipboard: /compact
- pasteText
- hideKeyboard
- tapOn:
    id: agent-input-send
- scrollUntilVisible:
    # The recovered timeline can remain scrolled above the newest compact item;
    # bring the virtualized divider into the hierarchy before asserting it.
    element:
      id: codex-timeline-context-compaction
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: codex-timeline-context-compaction
- assertNotVisible: CodexControlCommand
- assertNotVisible: CodexCompact
- scrollUntilVisible:
    element: resume-history-from-android-e2e
    direction: UP
    timeout: 45000
- assertVisible: resume-history-from-android-e2e
- scrollUntilVisible:
    element: H
    direction: DOWN
    timeout: 45000
- assertVisible: H
- scrollUntilVisible:
    element: Official Codex source E2E response
    direction: DOWN
    timeout: 45000
- assertVisible: Official Codex source E2E response
- assertNotVisible: Used 2 tools
- assertNotVisible: CodexControlCommand
- assertNotVisible: CodexCompact
- assertNotVisible: Plan mode with options
- assertNotVisible: Based on this message, call
- assertNotVisible: <happy-system>
- takeScreenshot: codex-recovered-after-process-death
